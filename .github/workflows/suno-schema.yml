name: Suno MCP schema watch

on:
  schedule:
    # 00:00 UTC = 09:00 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/suno-schema.yml'
      - 'src/*schema*.ts'
      - 'test/*schema*.test.ts'
      - 'test/fixtures/suno-input-schemas.json'
      - 'package*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  check:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: suno-schema-monitor
      cancel-in-progress: false
    steps:
      - name: Set temporary paths
        run: |
          echo "SUNO_SCHEMA_AUTH_FILE=$RUNNER_TEMP/suno-schema-auth.json" >> "$GITHUB_ENV"
          echo "SUNO_SCHEMA_ENCRYPTED_INPUT=$RUNNER_TEMP/suno-schema-previous/auth-state.enc" >> "$GITHUB_ENV"
          echo "SUNO_SCHEMA_ENCRYPTED_OUTPUT=$RUNNER_TEMP/auth-state.enc" >> "$GITHUB_ENV"
          echo "SUNO_SCHEMA_REPORT_DIR=$RUNNER_TEMP/suno-schema-report" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Find the latest encrypted OAuth state
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          SUNO_SCHEMA_AUTH: ${{ secrets.SUNO_SCHEMA_AUTH }}
          SCHEMA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node --import=tsx src/schema-monitor-state.ts find
      - name: Download encrypted OAuth state
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/suno-schema-previous
      - name: Restore OAuth credentials
        id: restore
        env:
          SUNO_SCHEMA_AUTH: ${{ secrets.SUNO_SCHEMA_AUTH }}
          SUNO_SCHEMA_STATE_KEY: ${{ secrets.SUNO_SCHEMA_STATE_KEY }}
        run: node --import=tsx src/schema-monitor-state.ts restore
      - name: Check live Suno tool schemas
        timeout-minutes: 3
        run: npm run check:schema:ci
      - name: Encrypt updated OAuth credentials
        id: seal
        if: always() && steps.restore.outcome == 'success'
        env:
          SUNO_SCHEMA_STATE_KEY: ${{ secrets.SUNO_SCHEMA_STATE_KEY }}
        run: node --import=tsx src/schema-monitor-state.ts seal
      - name: Persist encrypted OAuth state for the next run
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          path: ${{ runner.temp }}/auth-state.enc
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Save the schema comparison and live snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suno-schema-report
          path: ${{ runner.temp }}/suno-schema-report
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: Remove plaintext credentials
        if: always()
        run: |
          node -e 'require("node:fs").rmSync(process.env.SUNO_SCHEMA_AUTH_FILE, { force: true })'
